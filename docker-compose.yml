version: "3.9"

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''